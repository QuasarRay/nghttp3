[package]
name = "nghttp3-contracts"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lambars-powered executable contracts for the nghttp3 Rust reimplementation"
publish = false

[dependencies]
nghttp3-core = { path = "../nghttp3-core" }
lambars = { git = "https://github.com/QuasarRay/lambars.git", rev = "6b79ace7ebd04910c953497c85baa42ff9cee0dc", default-features = false, features = ["compose", "control"] }
lambars-verification = { git = "https://github.com/QuasarRay/lambars.git", rev = "6b79ace7ebd04910c953497c85baa42ff9cee0dc", package = "lambars-verification" }

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(verus)'] }
