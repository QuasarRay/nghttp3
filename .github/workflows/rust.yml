name: rust

on:
  push:
    paths:
      - "rust/**"
      - "lib/**"
      - "CMakeLists.txt"
      - "CMakeOptions.txt"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "lib/**"
      - "CMakeLists.txt"
      - "CMakeOptions.txt"
      - ".github/workflows/rust.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test safe-wrapper cases individually
        run: |
          set -euo pipefail
          for test in \
            header_flags_never_expose_no_copy_bits \
            validates_common_headers \
            creates_and_drops_client_connection \
            rejects_assertion_only_stream_preconditions \
            creates_standalone_qpack_objects \
            uvarint_round_trips_boundaries \
            runtime_version_is_available
          do
            echo "=== $test ==="
            cargo test --manifest-path rust/Cargo.toml -p nghttp3 "$test" -- --nocapture --test-threads=1
          done
      - name: Test workspace
        run: cargo test --manifest-path rust/Cargo.toml --workspace -- --test-threads=1
