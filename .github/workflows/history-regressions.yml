name: history-regressions

on:
  pull_request:
    paths:
      - "rust/verification/history/**"
      - "rust/tools/history/**"
      - "rust/nghttp3-core/**"
      - ".github/workflows/history-regressions.yml"
  workflow_dispatch:

jobs:
  mine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify pinned historical commits are present
        run: |
          grep '^commit = ' rust/verification/history/regressions.toml |
            cut -d'"' -f2 |
            while read -r sha; do git cat-file -e "$sha^{commit}"; done

      - name: Mine complete repository history
        run: bash rust/tools/history/mine-regressions.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nghttp3-regression-candidates
          path: target/regression-mining/candidates.tsv
          retention-days: 30
