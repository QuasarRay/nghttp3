name: rust-verification

on:
  pull_request:
    paths:
      - "rust/nghttp3-core/**"
      - "rust/nghttp3-contracts/**"
      - "rust/verification/**"
      - "rust/tools/verification/**"
      - "rust/Cargo.toml"
      - ".github/workflows/verification.yml"
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native dependencies for C differential oracle
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml -p nghttp3-core -p nghttp3-contracts --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml -p nghttp3-core -p nghttp3-contracts
      - name: Assert contract layer has no Tokio dependency
        run: |
          if cargo tree --manifest-path rust/Cargo.toml -p nghttp3-contracts | grep -E '(^| )tokio v'; then
            echo "Tokio entered the ioxide-oriented contract path" >&2
            exit 1
          fi

  kani:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Prove core harnesses
        env:
          KANI_COUNTEREXAMPLE_DIR: target/kani-counterexamples/core
        run: bash rust/tools/verification/run-kani.sh --manifest-path rust/Cargo.toml -p nghttp3-core

      - name: Prove Lambars-generated contract harnesses
        env:
          KANI_COUNTEREXAMPLE_DIR: target/kani-counterexamples/contracts
        run: bash rust/tools/verification/run-kani.sh --manifest-path rust/Cargo.toml -p nghttp3-contracts

      - name: Preserve Kani counterexample playback
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kani-concrete-playback
          path: target/kani-counterexamples/
          if-no-files-found: ignore
          retention-days: 30

  verus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Verus
        env:
          VERUS_VERSION: 0.2026.09.27.3cf1832
          VERUS_RUST_TOOLCHAIN: 1.98.1
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip
          bash rust/tools/verification/install-verus.sh
      - name: Verify QUIC varint proof model
        run: target/verus/verus rust/verification/verus/varint.rs
      - name: Verify settings proof model
        run: target/verus/verus rust/verification/verus/settings.rs
      - name: Verify ring-buffer proof model
        run: target/verus/verus rust/verification/verus/ringbuf.rs
      - name: Verify Priority parser proof model
        run: target/verus/verus rust/verification/verus/priority.rs
      - name: Verify QPACK buffer-growth proof model
        run: target/verus/verus rust/verification/verus/qpack_buffer.rs

  verusbelt-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pin semantic foundation
        env:
          VERUSBELT_REV: b9b14b2cb47b6a6307611578782adc3481627aac
        run: bash rust/tools/verification/check-verusbelt-pin.sh
