name: regression-history

on:
  push:
    branches:
      - "rust-port/**"
    paths:
      - "scripts/mine-regression-candidates.sh"
      - "verification/regressions.toml"
      - ".github/workflows/regression-history.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regression-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Mine complete repository history
        run: bash scripts/mine-regression-candidates.sh

      - name: Ensure curated source commits exist
        shell: bash
        run: |
          while IFS= read -r sha; do
            git cat-file -e "$sha^{commit}"
          done < <(sed -n 's/^source_commit = "\([0-9a-f]\{40\}\)"/\1/p' verification/regressions.toml)

      - name: Commit deterministic candidate index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/history-candidates.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "verification: refresh history regression candidates [history-mined]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
